system
 host-name             vmanager-1
 system-ip             1.1.255.1
 site-id               255
 admin-tech-on-failure
 no vrrp-advt-with-phymac
 sp-organization-name  biglab2
 organization-name     biglab2
 vbond 40.1.255.2
 !
  ntp
  parent
   no enable
   stratum 5
  exit
  server 40.1.255.253
   version 4
   prefer
  exit
  !
 vpn 0
 dns 1.1.1.1 secondary
 dns 40.1.255.254 primary
 interface eth0
  ip address 40.1.255.1/24
  ipv6 dhcp-client
  tunnel-interface
   allow-service all
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service stun
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 40.1.255.253
!

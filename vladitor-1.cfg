system
 host-name               validator-1
 system-ip               1.1.255.2
 site-id                 255
 admin-tech-on-failure
 no route-consistency-check
 no vrrp-advt-with-phymac
 sp-organization-name    biglab2
 organization-name       biglab2
 vbond 40.1.255.2 local
 !
 vpn 0
 dns 1.1.1.1 secondary
 dns 40.1.255.254 primary
 no interface ethernet0
 
 !
!
 interface ge0/0
  ip address 40.1.255.2/24
  tunnel-interface
   encapsulation ipsec
   allow-service all
   no allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service ospf
   no allow-service stun
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 40.1.255.253
